<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register - Caregiver Marketplace</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>CaregiverShare</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div class="auth-form">
        <h2>Register</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>I am a:</label>
                <select name="role" id="roleToggle">
                    <option value="client">Client</option>
                    <option value="caregiver">Caregiver</option>
                </select>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="firstName" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="lastName" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone">
            </div>

            <div id="caregiverFields" style="display:none;">
                <div class="form-group">
                    <label>Profession</label>
                    <input type="text" name="profession">
                </div>
                <div class="form-group">
                    <label>Experience (Years)</label>
                    <input type="number" name="experienceYears">
                </div>
            </div>

            <div class="form-group">
                <label>Profile Picture</label>
                <input type="file" id="registerProfileImage" name="profileImage" accept="image/*">
            </div>

            <div class="form-group">
                <label>Present Address</label>
                <input type="text" name="presentAddress" placeholder="Village, Thana, District" required>
            </div>
            <div class="form-group">
                <label>Permanent Address</label>
                <input type="text" name="permanentAddress" placeholder="Village, Thana, District" required>
            </div>

            <button type="submit" class="btn-primary">Register</button>
        </form>
    </div>
</body>

</html>

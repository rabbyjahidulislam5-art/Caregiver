<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header style="background: #333;">
        <h1>Admin Control Panel</h1>
        <nav>
            <button id="adminLogoutBtn" onclick="logoutAdmin()"
                style="background-color: #6f42c1; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">Logout</button>
        </nav>
    </header>

    <div class="container" style="flex-direction: column; align-items: flex-start;">
        <h2>Admin Actions</h2>
        <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px;">
            <button class="btn-primary" onclick="generateReport('users')">Report Generate</button>
            <button class="btn-primary" onclick="showMonitoring()">Monitoring</button>
            <button class="btn-primary" onclick="showUserManagement()">Add/Delete User</button>
            <button class="btn-primary" onclick="loadAdminCaregiverApprovals()">Approve Permissions</button>
            <button class="btn-primary" onclick="loadComplaints()">View Complaints</button>
        </div>

        <!-- 1. Report Area -->
        <div id="reportSection"
            style="display:none; width: 100%; margin-bottom: 20px; border: 1px solid #ddd; padding: 15px; background: #f9f9f9; border-radius: 8px;">
            <h3 style="color: #6a1b9a;">Report Generation</h3>

            <!-- Section A: Individual User Report -->
            <div style="margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee;">
                <h4>Individual User History</h4>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="email" id="reportUserEmail" placeholder="User Email (Client/Caregiver)"
                        style="padding: 8px; width: 250px;">
                    <select id="reportDuration" style="padding: 8px;">
                        <option value="Daily">Daily</option>
                        <option value="Monthly" selected>Monthly</option>
                        <option value="Yearly">Yearly</option>
                    </select>
                    <button class="btn-primary" onclick="downloadUserReport()">Download PDF</button>
                </div>
            </div>

            <!-- Section B: System Summary Report -->
            <div>
                <h4>System Reports</h4>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-primary" style="background-color: #2e7d32;"
                        onclick="downloadStatsReport()">Download Monthly Stats (PDF)</button>
                    <button class="btn-primary" style="background-color: #f57c00;"
                        onclick="downloadAssignmentsReport()">Download Active Assignments (PDF)</button>
                </div>
            </div>

            <div id="reportContent"></div>
        </div>

        <!-- 2. Permissions Queue -->
        <div id="permissionsSection" style="display:none; width: 100%; margin-bottom: 20px;">
            <h3>Pending Permissions Queue</h3>
            <div id="adminPendingList"></div>
        </div>

        <!-- 3. User Management -->
        <div id="userMgmtSection" style="display:none; width: 100%; margin-bottom: 20px;">
            <h3>User Management</h3>

            <div style="margin-bottom: 15px; border: 1px solid #eee; padding: 10px;">
                <h4>Add User</h4>
                <form id="adminAddUserForm">
                    <input type="text" name="username" placeholder="Username" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <select name="role">
                        <option value="client">Client</option>
                        <option value="caregiver">Caregiver</option>
                    </select>
                    <input type="text" name="email" placeholder="Email" required>
                    <input type="text" name="phone" placeholder="Phone">
                    <input type="text" name="bloodGroup" placeholder="Blood Group">
                    <!-- Profile details -->
                    <input type="text" name="firstName" placeholder="First Name" required>
                    <input type="text" name="lastName" placeholder="Last Name" required>
                    <input type="text" name="profession" placeholder="Profession (Caregiver)">
                    <input type="number" name="experienceYears" placeholder="Exp Years (Caregiver)">

                    <button type="submit" class="btn-primary">Create User</button>
                </form>
            </div>

            <h4>All Users</h4>
            <div id="adminUserList" style="max-height: 300px; overflow-y: auto;">Loading...</div>
        </div>

        <!-- 4. Monitoring (Placeholder) -->
        <div id="monitoringSection" style="display:none; width: 100%;">
            <h3>System Monitoring</h3>
            <p>System Status: <span style="color:green; font-weight:bold;">OPERATIONAL</span></p>
            <p>Active Nodes: 1</p>
            <p>DB Connection: Healthy</p>
        </div>

        <!-- 5. Complaints Section (NEW) -->
        <div id="complaintsSection" style="display:none; width: 100%;">
            <h3>Complaints & Feedback</h3>
            <div id="complaintsList" style="display: flex; flex-direction: column; gap: 15px;"></div>
        </div>



    </div>

</body>

</html>
